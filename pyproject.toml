[project]
name = "zoom-g1four"
version = "0.1.0"
description = "Reverse engineering and open-firmware effort for the Zoom G1 Four"
requires-python = ">=3.11"
dependencies = ["mido[ports-rtmidi]>=1.3"]

# No build backend is configured; install these manually:
# .venv/bin/python -m pip install pefile "sounddevice[numpy]"
[project.optional-dependencies]
recon = ["pefile>=2023.2.7", "sounddevice[numpy]>=0.4.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools"]
addopts = "-m 'not integration and not hardware'"
markers = [
    "integration: end-to-end tests that download vendor packages (run with -m integration)",
    "hardware: read-only tests against a connected pedal (run with -m hardware)",
]
